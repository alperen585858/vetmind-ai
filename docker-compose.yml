# One-command local stack (issue #29):
#
#   docker compose up --build        → http://localhost:8080  (demo: vet@demo.local / demo1234)
#   docker compose down              → stop (data is kept in the named volumes)
#   docker compose down -v           → stop and delete all data
#   docker compose up -d db          → only PostgreSQL on localhost:5432, for `npm run backend:dev`
#
# Data (#102): every record is in PostgreSQL (`db`), RAG vectors in ChromaDB (`chroma`),
# DICOM files in the vetmind_data volume. No SQLite files.
# Settings: put VETMIND_* overrides in a .env file next to this file (see backend/.env.example).
# Optional Redis (RQ jobs) for development lives in backend/docker-compose.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vetmind
      POSTGRES_PASSWORD: ${VETMIND_DB_PASSWORD:-vetmind}
      POSTGRES_DB: vetmind
    ports:
      - "${VETMIND_DB_PORT:-5432}:5432"
    volumes:
      - vetmind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetmind -d vetmind"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  chroma:
    # Same version as the chromadb client in backend/requirements.txt.
    image: chromadb/chroma:1.5.9
    volumes:
      - vetmind_chroma:/data
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
    environment:
      VETMIND_STORAGE: ${VETMIND_STORAGE:-postgres}
      VETMIND_DATABASE_URL: ${VETMIND_DATABASE_URL:-postgresql://vetmind:${VETMIND_DB_PASSWORD:-vetmind}@db:5432/vetmind}
      VETMIND_CHROMA_URL: ${VETMIND_CHROMA_URL:-http://chroma:8000}
      VETMIND_AUTH_ENABLED: ${VETMIND_AUTH_ENABLED:-0}
      VETMIND_DEPLOYMENT_MODE: ${VETMIND_DEPLOYMENT_MODE:-demo}
      VETMIND_JWT_SECRET: ${VETMIND_JWT_SECRET:-vetmind-demo-secret-change-me}
      # Reset links in emails / the server log point at the web container.
      VETMIND_PUBLIC_BASE_URL: ${VETMIND_PUBLIC_BASE_URL:-http://localhost:8080}
      VETMIND_LLM_PROVIDER: ${VETMIND_LLM_PROVIDER:-mock}
      # Semantic RAG (#101): bge-m3 from the host's Ollama (`ollama pull bge-m3`).
      # Without it the backend starts anyway on hash embeddings; System Status shows a warning.
      VETMIND_RAG_EMBEDDING: ${VETMIND_RAG_EMBEDDING:-ollama}
      VETMIND_RAG_EMBEDDING_URL: ${VETMIND_RAG_EMBEDDING_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # DICOM quarantine and other files; records are in Postgres, vectors in Chroma.
      - vetmind_data:/app/data
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${VETMIND_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vetmind_data:
  vetmind_pg:
  vetmind_chroma:
