# Hosted quality gate for Goal A software readiness (CPU-only, mock-default path).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · vitest · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  backend-gate:
    name: Backend regression gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: P0 regression gate
        run: |
          python -m pytest \
            tests/test_dicom_integrity_regressions.py \
            tests/test_analysis_coverage_honesty.py \
            tests/test_png_dicom_transforms.py \
            tests/test_vlm_image_grounding.py \
            tests/test_vlm_study_scale.py \
            tests/test_dicom_anonymize.py \
            tests/test_training_export_verification.py \
            tests/test_queue_reliability.py \
            tests/test_plugin_modularity_smoke.py \
            tests/test_pixel_opt_in_smoke_e2e.py \
            tests/test_hardening_p0.py \
            tests/test_bbox_edit_persistence.py \
            tests/test_evidence_verify_rbac.py \
            tests/test_training_export_api.py \
            -q --tb=line

  backend-unit:
    name: Backend unit suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        # + the optional ChromaDB client, so the Chroma store tests (#103) keep running
        run: pip install -r requirements.txt -r requirements-chroma.txt
      - name: Full pytest (CPU; vision extras optional/skip)
        run: python -m pytest -q --tb=line
      - name: Evaluation package tests (repo-root evaluation/)
        working-directory: .
        env:
          PYTHONPATH: .:backend
        run: python -m pytest evaluation/tests -q --tb=line -p no:cacheprovider

  backend-postgres:
    name: Backend on PostgreSQL (migrations · stores · API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # pgvector for the RAG store tests (#117)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vetmind
          POSTGRES_PASSWORD: vetmind
          POSTGRES_DB: vetmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetmind -d vetmind_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VETMIND_TEST_DATABASE_URL: postgresql://vetmind:vetmind@localhost:5432/vetmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Schema from an empty database (alembic upgrade head)
        run: alembic -x url=$VETMIND_TEST_DATABASE_URL upgrade head
      - name: Store and API tests on PostgreSQL
        run: python -m pytest -q --tb=short -m postgres tests/test_sql_stores.py tests/test_postgres_app.py tests/test_rag_pgvector.py

  ml-spine:
    name: ML spine segmentation (CPU smoke, synthetic data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/training/spine_seg/requirements.txt
      - name: Install CPU torch and pipeline dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/training/spine_seg/requirements.txt
      - name: Spine pipeline tests
        env:
          PYTHONPATH: .
        run: python -m pytest ml/tests -q --tb=short -p no:cacheprovider

  e2e:
    name: E2E (Playwright · desktop + mobile + protected)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend into backend/.venv (used by scripts/e2e-backend.mjs)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Browser (system Google Chrome, playwright channel "chrome")
        run: google-chrome --version
      - name: Demo mode (desktop + mobile)
        run: npx playwright test --project=desktop-chrome --project=mobile-chrome
      - name: Protected mode (auth on)
        if: success() || failure()
        env:
          E2E_PROTECTED: '1'
        run: npx playwright test --project=e2e-protected
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-report/
            e2e-report-protected/
            test-results/
            test-results-protected/
          retention-days: 14
