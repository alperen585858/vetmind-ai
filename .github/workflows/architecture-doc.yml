# Keeps docs/AI_MIMARISI.md in step with the code.
# The diagram is generated from backend/app/services/architecture_status.py (the same source as
# the admin "AI Mimarisi" page).
#   - Pull request: fails if the committed diagram is out of date (run the script and commit).
#   - Push to main: regenerates the diagram and commits it if it changed.
name: AI architecture diagram

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/**'
      - 'backend/scripts/generate_architecture_doc.py'
      - 'docs/AI_MIMARISI.md'
      - '.github/workflows/architecture-doc.yml'
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/scripts/generate_architecture_doc.py'
      - 'docs/AI_MIMARISI.md'
      - '.github/workflows/architecture-doc.yml'

concurrency:
  group: architecture-doc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagram:
    name: Generate / check docs/AI_MIMARISI.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check diagram is up to date
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: python scripts/generate_architecture_doc.py --check

      - name: Regenerate diagram
        if: github.event_name == 'push'
        working-directory: backend
        run: python scripts/generate_architecture_doc.py

      - name: Commit regenerated diagram
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- docs/AI_MIMARISI.md; then
            echo "Diagram already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI_MIMARISI.md
          git commit -m "docs: regenerate AI architecture diagram"
          git push
