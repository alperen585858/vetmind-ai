# Security headers for every response (included in each location: a location with its own
# add_header does not inherit server-level ones). `always` also covers 4xx/5xx answers.
#
# CSP: scripts only from this origin (no inline/eval), Google Fonts for CSS/fonts, images from
# this origin plus data:/blob: (evidence overlays, QR codes), API calls same-origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers ignore HSTS over plain HTTP; it takes effect once TLS is terminated in front of this.
add_header Strict-Transport-Security "max-age=31536000" always;
