# VetMind web container (issue #29): static UI + /api reverse proxy to the backend service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DICOM studies are uploaded through /api; the backend enforces its own per-file limits.
    client_max_body_size 512m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Real-model analysis and report generation can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build output (one file per page since #25): cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/giris, /vakalar/…) all serve index.html, which must never be cached
    # so a new deploy is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
