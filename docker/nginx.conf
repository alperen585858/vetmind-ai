# VetMind web container (issue #29): static UI + /api reverse proxy to the backend service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DICOM studies are uploaded through /api. The backend caps one upload at 100 MiB in total
    # (25 MiB per file); allow a little multipart overhead and reject anything larger here.
    client_max_body_size 110m;

    # Docker's DNS. Without it nginx resolves "backend" once at start and keeps that IP; after
    # the backend container is recreated (docker compose up --build) every /api call got a 502
    # until the web container was restarted. With a variable in proxy_pass nginx re-resolves
    # the name (cached 10 s) and passes the original request URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Never show nginx's version in headers or error pages.
    server_tokens off;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Real-model analysis and report generation can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build output (one file per page since #25): cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/giris, /vakalar/…) all serve index.html, which must never be cached
    # so a new deploy is picked up on the next load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
