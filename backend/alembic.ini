# Alembic config for the VetMind database (#102).
#   alembic upgrade head                     # uses VETMIND_DATABASE_URL / DATABASE_URL
#   alembic -x url=sqlite:///data/x.sqlite3 upgrade head
# The app runs `upgrade head` itself on startup (app/storage/sql.py), so this is for
# inspecting history or creating new revisions: alembic revision -m "add ..."
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
