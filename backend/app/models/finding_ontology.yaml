# Minimal finding-code families for conflict detection (ISS-FUS-01).
# Same family = soft severity difference; cross-family = hard code conflict.
# Not a clinical ontology — development heuristic only.

families:
  IVDD:
    - IVDD
    - IVDD_SUSPECTED
    - IVDD_CONFIRMED
    - DISC_HERNIATION
    - INTERVERTEBRAL_DISC
  MENINGIOMA:
    - MENINGIOMA
    - INTRACRANIAL_MASS
    - BRAIN_MASS
  HYDROCEPHALUS:
    - HYDROCEPHALUS
    - VENTRICULOMEGALY
    - VENTRICLE-DILATION
    - VENTRICLE_DILATION
    - VENTRICLE-DILATATION
    - VENTRICLE_DILATATION
    - VENTRICLE-ASYMMETRY
    - VENTRICLE_ASYMMETRY
    - BRAIN-VENTRICLES
    - BRAIN_VENTRICLES
    - BRAIN-VENTRICLE
    - BRAIN_VENTRICLE
    - VENTRICLE-STRUCTURE
    - VENTRICLE_STRUCTURE
    - VENTRICLE-VIEW
    - VENTRICLE_VIEW
    - VENTRICLE-VISUAL
    - VENTRICLE_VISUAL
    - VENTRICLE-SHAPE
    - VENTRICLE_SHAPE
    - VENTRICULAR-SYSTEM
    - VENTRICULAR_SYSTEM
  BRAIN:
    - BRAIN-PARENCHYMA
    - BRAIN_PARENCHYMA
    - BRAIN-STRUCTURE
    - BRAIN_STRUCTURE
  FRACTURE:
    - FRACTURE
    - SKULL_FRACTURE
    - MAXILLOFACIAL_FRACTURE
  TECHNIQUE:
    - IMAGE-QUALITY
    - IMAGE_QUALITY
    - REGION-APPEARANCE
    - ANATOMIC-STRUCTURE
    - SIGNAL-UNSPECIFIED
    - VLM-UNSPECIFIED
    - VLM-FINDING
    - VISIBLE-ANATOMY

# Explicit contradictions (normalized: upper, _ and - equivalent).
opposing_pairs:
  - [VENTRICLE-DILATION, VENTRICLE-STRUCTURE]
  - [VENTRICLE-DILATATION, VENTRICLE-STRUCTURE]
  - [VENTRICLE-DILATION, BRAIN-VENTRICLE]
  - [VENTRICLE-DILATATION, BRAIN-VENTRICLE]
  - [VENTRICLE-DILATION, VENTRICLE-VIEW]
  - [VENTRICLE-DILATATION, VENTRICLE-VIEW]
  - [VENTRICLE-DILATION, VENTRICLE-VISUAL]
  - [VENTRICLE-DILATION, VENTRICLE-SHAPE]
  - [VENTRICULOMEGALY, VENTRICLE-STRUCTURE]
  - [VENTRICULOMEGALY, BRAIN-VENTRICLE]
  - [HYDROCEPHALUS, VENTRICLE-STRUCTURE]
  - [HYDROCEPHALUS, BRAIN-VENTRICLE]

notes: >
  Codes not listed are treated as their own singleton family (code itself).
  Agreement within a family is not clinical proof.
  TECHNIQUE codes are excluded from pathology conflict pairing.
