# Protected deployment overlay (copy / merge with docker-compose.yml).
#
#   cp docker-compose.protected.example.yml docker-compose.protected.yml
#   # edit secrets, then:
#   docker compose -f docker-compose.yml -f docker-compose.protected.yml up --build
#
# Requirements enforced at backend startup (validate_security_settings):
#   - VETMIND_AUTH_ENABLED=1
#   - VETMIND_JWT_SECRET ≠ demo default, length ≥ 32
#   - VETMIND_MALWARE_SCAN_REQUIRED=1 + VETMIND_MALWARE_SCANNER=clamav (ClamAV daemon below;
#     uploads are refused with 503 while it is unreachable or still loading signatures)
#   - VETMIND_DICOM_IDENTITY_SCRUB=1
#
# Demo-only APIs (fixture DICOM, demo card payments) return 403 in this mode.

services:
  db:
    # No default database password in protected mode (#119); the backend URL reuses it.
    environment:
      POSTGRES_PASSWORD: ${VETMIND_DB_PASSWORD:?set VETMIND_DB_PASSWORD in .env}

  clamav:
    # Virus signatures update themselves (freshclam). First start downloads them (~300 MB).
    image: clamav/clamav:stable
    volumes:
      - vetmind_clamav:/var/lib/clamav
    restart: unless-stopped

  web:
    # Reachable from other machines (put TLS in front). docker-compose.yml binds 127.0.0.1.
    ports: !override
      - "${VETMIND_WEB_BIND:-0.0.0.0}:${VETMIND_WEB_PORT:-8080}:80"
  backend:
    environment:
      VETMIND_DEPLOYMENT_MODE: protected
      VETMIND_AUTH_ENABLED: "1"
      VETMIND_JWT_SECRET: ${VETMIND_JWT_SECRET:?set a strong secret ≥32 chars}
      VETMIND_ALLOW_INSECURE_DEMO: "0"
      VETMIND_MALWARE_SCAN_REQUIRED: "1"
      VETMIND_MALWARE_SCANNER: clamav
      VETMIND_CLAMD_HOST: clamav
      VETMIND_CLAMD_PORT: "3310"
      VETMIND_DICOM_IDENTITY_SCRUB: "1"
      # Encrypt quarantined files on disk (#126). Keep a backup of the key: without it the
      # files cannot be read. Existing files: python scripts/encrypt_quarantine.py
      VETMIND_ENCRYPTION_AT_REST: aes-gcm
      VETMIND_BLOB_KEY: ${VETMIND_BLOB_KEY:?set VETMIND_BLOB_KEY (32 random bytes, url-safe base64)}
      VETMIND_TENANT_ISOLATION: "1"
      # Self-registration defaults off in protected; enable only with a real clinic id.
      VETMIND_SELF_REGISTRATION: "0"
      # VETMIND_SELF_REGISTRATION: "1"
      # VETMIND_SELF_REGISTRATION_OWNER_CLINIC: clinic-your-real-id
      VETMIND_PUBLIC_BASE_URL: ${VETMIND_PUBLIC_BASE_URL:-https://vetmind.example}
      # Password reset: without SMTP, tokens are not minted (forgot still returns 202).
      VETMIND_SMTP_HOST: ${VETMIND_SMTP_HOST:-}
      VETMIND_SMTP_PORT: ${VETMIND_SMTP_PORT:-587}
      VETMIND_SMTP_USERNAME: ${VETMIND_SMTP_USERNAME:-}
      VETMIND_SMTP_PASSWORD: ${VETMIND_SMTP_PASSWORD:-}
      VETMIND_SMTP_FROM: ${VETMIND_SMTP_FROM:-VetMind <no-reply@vetmind.example>}
      # Real AI (optional — omit to keep mock LLM but still run protected auth)
      VETMIND_LLM_PROVIDER: ${VETMIND_LLM_PROVIDER:-openai}
      VETMIND_LLM_API_KEY: ${VETMIND_LLM_API_KEY:-}
      VETMIND_LLM_MODEL_ID: ${VETMIND_LLM_MODEL_ID:-}
      VETMIND_VLM_ENABLED: ${VETMIND_VLM_ENABLED:-0}

volumes:
  vetmind_clamav:
